    section_header_margin: 0 auto 3.5rem
    section_header_label_spacing: 0.24em
    section_header_label_size: calc(var(--p3-size) * 0.88888889)
    section_header_label_weight: '600'
    section_header_label_mb: 0.85rem
    section_header_label_pb: 0.6rem
    section_header_p_size: calc(var(--text-size) * 0.98823529)
    section_header_label_after_width: 28px
  sermon-category:
    sermon_category_size: calc(var(--p3-size) * 0.8)
