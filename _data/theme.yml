  header-inner:
    header_inner_max_width: 1400px
    header_inner_pad: 0.75rem 2rem
    header_inner_gap: 1.5rem
    header_inner_min_height_upto960: 84px
    header_inner_pad_upto960: 0.6rem 1.25rem
