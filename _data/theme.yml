    main_nav_a_spacing: 0.12em
    main_nav_a_pad: 0.4rem 0
    main_nav_pad_upto720: 1.25rem 1.5rem
    main_nav_ul_gap_upto720: 1rem
    main_nav_a_size_upto720: calc(var(--text-size) * 0.98823529)
    main_nav_shadow_upto720: 0 10px 30px rgba(var(--color-shadow-rgb), 0.35)
  menu-toggle:
    menu_toggle_pad: 0.5rem
    menu_toggle_gap: 5px
    menu_toggle_span_radius: 2px
    menu_toggle_span_width: 26px
  page:
    focus_visible_radius: 4px
    h2_mb: 0.75rem
    h3_mb: 0.5em
    h4_mb: 0.75em
    p_mb: 1rem
  platform-card:
    platform_card_gap: 0.4rem
  platform-cta:
    platform_cta_weight: '600'
    platform_cta_size: calc(var(--p3-size) * 0.88888889)
    platform_cta_spacing: 0.14em
  platform-name:
