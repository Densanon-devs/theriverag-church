    blog_post_post_pic_left_margin: 0.4rem 1.75rem 1rem 0
    blog_post_post_pic_right_margin: 0.4rem 0 1rem 1.75rem
    blog_post_post_pic_full_post_pic_left_margin: 1.75rem auto
    blog_post_post_pic_left_margin_upto640: 1.5rem auto
    blog_post_post_pic_wide_img_shape: 16 / 9
    blog_post_post_pic_square_img_shape: 1 / 1
