    cms_form_status_size: var(--h4-size)
    cms_form_status_line: '1.5'
    cms_form_status_is_error_a_weight: '600'
  container:
    container_pad: 0 1.5rem
  footer-bottom:
    footer_bottom_pt: 2rem
    footer_bottom_size: calc(var(--p3-size) * 0.91111111)
