# Site styles: the colours, fonts and shapes used on every page.
# Edit them in the admin panel (Website > Site styles). The panel writes
# these into the top of the stylesheet named below, between the
# cms:theme markers. This file is The River's look as of November 2026.
stylesheet: css/styles.css
colors:
  bg: '#ffffff'
  bg_light: '#f7f4ee'
  bg_dark: '#0b0b0c'
  bg_darker: '#060607'
  bg_accent: '#3b4f4c'
  bg_sage: '#afc4bf'
  text: '#15161a'
  text_muted: '#5e6168'
  text_light: '#f5f2ec'
  accent: '#cfa861'
  accent_hover: '#b8924c'
  accent_deep: '#755827'
  border: '#e8e2d4'
  highlight: '#2680c2'
  overlay: '#0a0a0c'
  on_photo: '#ffffff'
  shadow: '#000000'
fonts:
  heading: '''Oswald'', ''Arial Narrow'', Arial, sans-serif'
  display: '''Abel'', ''Oswald'', sans-serif'
  body: '''Poppins'', -apple-system, BlinkMacSystemFont, ''Segoe UI'', Roboto, sans-serif'
shape:
  max_width: 1200px
  radius: 10px
  radius_lg: 22px
  button_radius: 999px
  section_space: 6rem
# Text styles: Heading 1-4 and Paragraph 1-3. A page, a section or a single
# heading can use another value for any of these; here is what they start from.
type:
  text_size: 17px
  text_line: '1.7'
  text_weight: '400'
  heading_line: '1.12'
  heading_weight: '600'
  heading_spacing: 0.005em
  h1_size: clamp(2.4rem, 5.2vw, 4.25rem)
  h1_transform: uppercase
  h1_spacing: 0.02em
  h2_size: clamp(1.85rem, 3.2vw, 2.75rem)
  h2_transform: uppercase
  h2_spacing: 0.015em
  h3_size: 1.4rem
  h4_size: 0.95rem
  h4_transform: uppercase
  h4_spacing: 0.18em
  h4_weight: '600'
  p1_size: 1.25rem
  p3_size: 0.9rem
buttons:
  button_font: var(--font-display)
  button_size: 0.85rem
  button_weight: '600'
  button_transform: uppercase
  button_spacing: 0.12em
  button_padding: 0.85rem 1.75rem
  button_border: 1.5px
  button_bg: var(--color-accent)
  button_text: var(--color-bg-dark)
  button_hover_bg: var(--color-accent-hover)
  button2_bg: transparent
  button2_text: var(--color-text-light)
  button2_border: rgba(var(--color-on-photo-rgb), 0.65)
  button3_text: var(--color-accent)
look:
  link_color: var(--color-accent)
  link_hover: var(--color-accent-hover)
  header_bg: var(--color-bg-dark)
  header_text: var(--color-text-light)
  footer_bg: var(--color-bg-darker)
  footer_text: var(--color-text-light)
  divider_color: var(--color-accent)
  post_pic_radius: var(--radius)
  caption_size: 0.9rem
  caption_color: var(--color-text-muted)
  caption_align: center
# Sizes that belong to kinds of section: cards, the opener, the top bar.
# The three "scale" values multiply what each section's design calls for
# (1 = as designed), so one slider moves them all together.
sections:
  card_radius: 14px
  media_radius: 16px
  panel_radius: 18px
  border_width: 1px
  card_space: '1'
  space_scale: '1'
  shade_strength: '1'
  hero_height: 86vh
  hero_height_phone: 70vh
  header_height: 120px
  logo_height: 96px
  bar_padding: 0.65rem 1rem
  bar_size: 0.9rem
  bar_spacing: 0.12em
  bar_transform: uppercase
  bar_text: var(--color-bg-dark)
  accent_line: 2px
  accent_line_thick: 3px
  hero_focus: center
  invitation_focus: center
  post_width: 760px
  post_h2_size: 1.6rem
  post_h3_size: 1.3rem
  post_line: '1.75'
# The inner details of each kind of section: text sizes, gaps, margins,
# padding, columns, shadows, picture shapes. A text size points at a text
# style above times a factor, so changing Paragraph 3 or Heading 3 reaches
# it. Names end in _upto768 and the like where the value is for screens up
# to that width.
components:
  about-row:
    about_row_gap: 3.5rem
    about_row_max_width: 1100px
  about-section:
    about_section_h1_size: clamp(1.85rem, 3.2vw, 2.5rem)
    about_section_h1_margin: 0 auto 2.5rem
    about_section_h1_max_width: 1100px
    about_section_h1_spacing: 0.04em
    about_section_h1_weight: '500'
  about-text:
    about_text_p_mb: 1rem
  about-when:
    about_when_mt: 1.25rem
    about_when_pad: 0.6rem 1.25rem
    about_when_weight: '600'
    about_when_radius: 999px
    about_when_spacing: 0.12em
    about_when_size: calc(var(--p3-size) * 0.94444444)
  accordion-body:
    accordion_body_pt: 1.25rem
    accordion_body_p_size: calc(var(--h4-size) * 1.03157895)
    accordion_body_p_line: '1.7'
    accordion_body_p_mb: 0.5rem
    accordion_body_when_mt: 0.85rem
    accordion_body_when_size: var(--p3-size)
    accordion_body_when_spacing: 0.14em
  accordion-card:
    accordion_card_summary_gap: 1rem
    accordion_card_summary_h2_size: clamp(1.2rem, 1.8vw, 1.5rem)
    accordion_card_summary_h2_spacing: 0.06em
    accordion_card_summary_h2_weight: '500'
  accordion-chev:
    accordion_chev_mr: 4px
    accordion_chev_width: 12px
    accordion_chev_height: 12px
  accordion-list:
    accordion_list_gap: 1rem
  announcement-bar:
    announcement_bar_weight: '600'
  archive-note:
    archive_note_mt: 3rem
    archive_note_a_spacing: 0.16em
    archive_note_a_weight: '600'
    archive_note_a_size: calc(var(--p3-size) * 0.94444444)
  belief-card:
    belief_card_h2_size: calc(var(--text-size) * 1.08235294)
    belief_card_h2_mb: 0.75rem
    belief_card_h2_spacing: 0.06em
    belief_card_h2_weight: '500'
    belief_card_p_size: var(--h4-size)
    belief_card_p_line: '1.65'
    belief_card_p_opacity: '0.88'
  beliefs:
    beliefs_heading_size: clamp(2rem,3.5vw,2.8rem)
    beliefs_heading_mb: 0.5rem
    beliefs_link_mt: 2.5rem
  beliefs-grid:
    beliefs_grid_columns: '2'
    beliefs_grid_gap: 1.25rem
    beliefs_grid_max_width: 1100px
  blog-back:
    blog_back_margin: 0 0 .8rem
    blog_back_a_spacing: .1em
    blog_back_a_size: calc(var(--p3-size) * 0.86666667)
  blog-card:
    blog_card_pad: 1.7rem 0
    blog_card_h2_size: calc(var(--h3-size) * 1.10714286)
    blog_card_h2_margin: 0 0 .3rem
    blog_card_img_mb: 1rem
    blog_card_img_max_height: 320px
  blog-cta:
    blog_cta_gap: .8rem
  blog-date:
    blog_date_spacing: .1em
    blog_date_size: calc(var(--p3-size) * 0.88888889)
    blog_date_margin: 0 0 .6rem
  blog-empty:
