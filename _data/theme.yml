  blog-rule:
    blog_rule_margin: 2.6rem 0 1.6rem
  blog-summary:
    blog_summary_margin: .2rem 0 .7rem
    blog_summary_line: '1.6'
  btn-lg:
    btn_lg_pad: 1rem 2.25rem
    btn_lg_size: var(--h4-size)
  btn-primary:
    btn_primary_shadow: 0 8px 20px -8px rgba(var(--color-accent-rgb), 0.6)
