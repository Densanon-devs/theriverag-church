    hero_content_h1_spacing: 0.04em
    hero_content_h1_mb: 1.5rem
    hero_content_p_size: clamp(1.05rem, 1.3vw, 1.2rem)
    hero_content_p_margin: 0 auto 2.25rem
    hero_content_p_max_width: 620px
    hero_content_p_line: '1.7'
    hero_content_h1_text_shadow: 0 2px 24px rgba(var(--color-shadow-rgb), 0.45)
    hero_content_p_opacity: '0.94'
  hero-frame:
    hero_frame_max_width: 880px
  inline-values:
    inline_values_gap: 1.25rem
    inline_values_p_size: clamp(1.5rem, 2.6vw, 2.1rem)
    inline_values_p_weight: '500'
    inline_values_p_spacing: 0.06em
    inline_values_p_line: '1.15'
    inline_values_p_sep_margin: 0 0.5em
