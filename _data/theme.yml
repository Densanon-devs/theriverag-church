# Site styles: the colours, fonts and shapes used on every page.
# Edit them in the admin panel (Website > Site styles). The panel writes
# these into the top of the stylesheet named below, between the
# cms:theme markers. This file is The River's look as of November 2026.
stylesheet: css/styles.css
colors:
  bg: '#ffffff'
  bg_light: '#f7f4ee'
  bg_dark: '#0b0b0c'
  bg_darker: '#060607'
  bg_accent: '#3b4f4c'
  bg_sage: '#afc4bf'
  text: '#15161a'
  text_muted: '#5e6168'
  text_light: '#f5f2ec'
  accent: '#cfa861'
  accent_hover: '#b8924c'
  accent_deep: '#755827'
  border: '#e8e2d4'
  highlight: '#2680c2'
  overlay: '#0a0a0c'
fonts:
  heading: '''Oswald'', ''Arial Narrow'', Arial, sans-serif'
  display: '''Abel'', ''Oswald'', sans-serif'
  body: '''Poppins'', -apple-system, BlinkMacSystemFont, ''Segoe UI'', Roboto, sans-serif'
shape:
  max_width: 1200px
  radius: 10px
  radius_lg: 22px
  button_radius: 999px
  section_space: 6rem
variables:
  shadow_sm: 0 2px 10px rgba(0, 0, 0, 0.05)
  shadow: 0 14px 40px rgba(0, 0, 0, 0.10)
  shadow_lg: 0 30px 80px rgba(0, 0, 0, 0.28)
  transition: 250ms cubic-bezier(.2,.7,.2,1)
fonts_loaded:
- Abel
- Oswald
- Poppins
